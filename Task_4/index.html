<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>task-4</title>
  </head>
  <body>
    <!-- Header Section -->
    <header class="bg-purple-500 shadow-md sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16"
      >
        <div class="flex items-center space-x-4">
          <img class="h-8" src="/src/assets/reshot-icon-game.svg" />
        </div>
        <div class="flex items-center justify-center space-x-4">
          <a href="/" class="hidden md:inline-block text-3xl text-center font-bold"
            >Gamehub</a
          >
        </div>

        <div class="flex items-center space-x-3">
          <div class="flex flex-row items-center justify-between gap-3">
            <button class="md:hidden p-2" aria-label="Open Search">🔍</button>
            <button
              class="bg-blue-500 shadow-2xl text-white text-shadow-black hover:bg-blue-700 cursor-pointer px-3 py-2 rounded-2xl"
            >
              Login
            </button>
            <button
              class="bg-blue-500 shadow-2xl text-white text-shadow-black hover:bg-blue-700 cursor-pointer px-3 py-2 rounded-2xl"
            >
              Register
            </button>
          </div>
          <button class="md:hidden">Menu</button>
        </div>
      </div>
    </header>

    <section class="bg-gradient-to-r from-indigo-300 via-indigo-400 to-sky-500">
      <div class="max-w-7xl min-h-[80vh] flex flex-col items-center justify-center py-20 gap-6">
        <h1 class="text-6xl md:text-7xl font-bold font-serif text-center text-white">Welcome to Gamehub</h1>
        <p class="mt-4 text-gray-100 text-center max-w-2xl">
          Your ultimate destination for all gaming needs.
        </p>

        <div class="w-full flex flex-col items-center gap-4 mt-6 px-4">
          <div class="w-full max-w-xl">
            <input
              type="search"
              aria-label="Search games"
              class="w-full rounded-full px-4 py-2 border border-gray-300 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="Search games..."
            />
          </div>
        </div>

        <div class="mt-4 flex flex-column justify-center">
          <button class="bg-blue-400 p-3 rounded-2xl">
            <a href="/main-page.html"
              class="text-white font-semibold hover:text-gray-200"
              >Search</a>
          </button>
        </div>
      </div>
    </section>

    <footer class="bg-gradient-to-r from-black via-grey to-black min-h-[20vh]">
      <div class="max-w-7xl mx-auto px-4 pt-9 text-1xl text-center text-white">
        © 2026 Gamehub. All rights reserved.
      </div>
    </footer>
  </body>
</html>
