<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Shopping Cart - Gamehub</title>
  </head>

  <body>
    <!-- Header -->
    <header class="bg-purple-500 shadow-md sticky top-0 z-50">
      <!-- Container -->
      <div
        class="max-w-7xl mx-auto flex justify-between items-center px-4 h-16"
      >
        <!-- Logo -->
        <div class="flex items-center justify-center">
          <img
            src="/src/assets/reshot-icon-game.svg"
            alt=""
            class="w-auto h-8"
          />
        </div>
        <!-- Title -->
        <div>
          <h1 class="text-3xl text-center">Gamehub</h1>
        </div>
        <!-- Account -->
        <div class="flex gap-4 px-3">
          <button
            class="bg-sky-400 px-4 py-2 rounded-3xl hover:bg-sky-500 hover:text-white"
          >
            Login
          </button>
          <button
            class="bg-sky-400 px-4 py-2 rounded-3xl hover:bg-sky-500 hover:text-white"
          >
            Signup
          </button>
        </div>
      </div>
    </header>

    <!-- Main Cart Section -->
    <section class="max-w-7xl mx-auto px-4 py-8">
      <!-- Title and Back Button -->
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold">Shopping Cart</h2>
        <a href="main-page.html" class="text-purple-600 hover:text-purple-800">
          ← Back to Shop
        </a>
      </div>

      <!-- Empty Cart Message (hidden by default) -->
      <div id="empty-cart" class="hidden text-center py-12">
        <p class="text-2xl text-gray-500">Your cart is empty!</p>
        <a
          href="main-page.html"
          class="text-purple-600 hover:underline mt-4 inline-block"
        >
          Start Shopping
        </a>
      </div>

      <!-- Cart Items Container (filled by JavaScript) -->
      <div id="cart-items" class="space-y-4 mb-8">
        <!-- JavaScript will insert cart items here -->
        
      </div>

      <!-- Total Section -->
      <div class="border-t pt-4">
        <div class="flex justify-between items-center mb-4">
          <span class="text-2xl font-bold">Total:</span>
          <span id="total-price" class="text-2xl font-bold text-green-600"
            >$0.00</span
          >
        </div>
        <button
          class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition"
        >
          Proceed to Checkout
        </button>
      </div>
    </section>

    <script src="/src/cart.js" defer></script>
  </body>
</html>
